[package]
name = "symphonia-wasm"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
description = "WASM bindings for Symphonia audio decoding, used by HTMLPlayer."

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
console_error_panic_hook = "0.1"
symphonia = { version = "0.6", default-features = false, features = [
    "aac",
    "adpcm",
    "alac",
    "flac",
    "mp1",
    "mp2",
    "mp3",
    "pcm",
    "vorbis",
    "caf",
    "isomp4",
    "mkv",
    "ogg",
    "aiff",
    "wav",
    "ape",
    "id3v1",
    "id3v2",
    "opt-simd",
] }

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"