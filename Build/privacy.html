<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Muzari Privacy Policy</title>
    <meta name="description" content="Muzari Privacy Policy" />
    <link href="./src/global.css" rel="stylesheet" />
    <link
      href="./src/ui/resources/themes/Palettes/Blue/Blue.theme.css"
      rel="stylesheet"
      id="theme-link"
    />
    <script>
      (function () {
        const savedMode = localStorage.getItem("themeMode") || "auto";
        if (savedMode === "dark") {
          document.documentElement.classList.add("dark");
        } else if (savedMode === "auto") {
          if (
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches
          ) {
            document.documentElement.classList.add("dark");
          }
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/pages/privacyEntry.tsx"></script>
  </body>
</html>
