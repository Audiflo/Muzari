name: Create single file build

on:
  push:
    branches: ["*"]
  workflow_dispatch:

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Build/package-lock.json 

      - name: Install dependencies
        working-directory: Build
        run: npm ci

      - name: Setup WASM toolchain
        uses: ./.github/actions/setup-wasm

      - name: Build Symphonia WASM decoder
        uses: ./.github/actions/verify-wasm

      - name: Build
        working-directory: Build
        run: npm run build:single

      - name: Rename for distribution
        working-directory: Build/dist
        run: mv index.html HTMLPlayer-v2.html

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HTMLPlayer-Standalone
          path: Build/dist/HTMLPlayer-v2.html
          if-no-files-found: error
