name: Deploy PR build to Netlify

on:
  workflow_run:
    workflows: ["Build PR for Netlify"]
    types: [completed]

permissions:
  actions: read
  contents: read
  deployments: write
  issues: write
  pull-requests: write

concurrency:
  group: netlify-preview-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'

    runs-on: ubuntu-latest
    environment: netlify-preview

    permissions:
      actions: read
      contents: read
      deployments: write
      issues: write
      pull-requests: write

    steps:
      - name: Resolve pull request
        id: pr
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const run = context.payload.workflow_run;

            const headRepo = run.head_repository?.full_name;
            const headBranch = run.head_branch;
            const runSha = run.head_sha;

            if (!headRepo || !headBranch || !runSha) {
              throw new Error("Workflow run is missing PR source information.");
            }

            const prs = await github.paginate(
              github.rest.pulls.list,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: "open",
                base: "main",
                per_page: 100
              }
            );

            const matches = prs.filter(pr =>
              pr.head.repo?.full_name === headRepo &&
              pr.head.ref === headBranch
            );

            if (matches.length === 0) {
              core.notice(`No open PR found for ${headRepo}:${headBranch}.`);
              core.setOutput("skip", "true");
              return;
            }

            if (matches.length !== 1) {
              throw new Error(`Expected one matching PR, found ${matches.length}.`);
            }

            const pr = matches[0];

            if (
              pr.head.sha !== runSha &&
              pr.merge_commit_sha !== runSha
            ) {
              core.notice(`PR #${pr.number} has moved on. Skipping stale deployment.`);
              core.setOutput("skip", "true");
              return;
            }

            core.setOutput("skip", "false");
            core.setOutput("number", String(pr.number));
            core.setOutput("head-sha", pr.head.sha);
            core.setOutput("run-sha", runSha);

      - name: Download Netlify artifact
        if: steps.pr.outputs.skip != 'true'
        uses: actions/download-artifact@v5
        with:
          name: netlify-preview
          path: ${{ runner.temp }}/netlify-preview
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate artifact
        if: steps.pr.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail

          DIR="${{ runner.temp }}/netlify-preview"

          if [ ! -d "$DIR" ]; then
            echo "Artifact directory does not exist."
            exit 1
          fi

          if find "$DIR" -type l -print -quit | grep -q .; then
            echo "Artifact contains symlinks."
            exit 1
          fi

          if ! find "$DIR" -type f -print -quit | grep -q .; then
            echo "Artifact is empty."
            exit 1
          fi

      - name: Deploy to Netlify
        id: netlify
        if: steps.pr.outputs.skip != 'true'
        uses: nwtgck/actions-netlify@v3
        with:
          publish-dir: ${{ runner.temp }}/netlify-preview
          production-deploy: false
          enable-github-deployment: false
          enable-pull-request-comment: false
          enable-commit-comment: false
          overwrites-pull-request-comment: false
          fails-without-credentials: true
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

      - name: Create GitHub deployment and PR comment
        if: steps.pr.outputs.skip != 'true'
        uses: actions/github-script@v8
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          PR_HEAD_SHA: ${{ steps.pr.outputs.head-sha }}
          RUN_HEAD_SHA: ${{ steps.pr.outputs.run-sha }}
          DEPLOY_URL: ${{ steps.netlify.outputs.deploy-url }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prNumber = Number(process.env.PR_NUMBER);
            const expectedHeadSha = process.env.PR_HEAD_SHA;
            const runHeadSha = process.env.RUN_HEAD_SHA;
            const deployUrl = process.env.DEPLOY_URL;
            const runId = process.env.RUN_ID;

            if (!Number.isInteger(prNumber) || prNumber <= 0) {
              throw new Error("Invalid PR number.");
            }

            if (!deployUrl) {
              throw new Error("Netlify did not return a deploy URL.");
            }

            const parsedUrl = new URL(deployUrl);

            if (
              parsedUrl.protocol !== "https:" ||
              !(
                parsedUrl.hostname === "netlify.app" ||
                parsedUrl.hostname.endsWith(".netlify.app")
              )
            ) {
              throw new Error(`Unexpected Netlify URL: ${deployUrl}`);
            }

            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber
            });

            if (pr.state !== "open" || pr.base.ref !== "main") {
              throw new Error("PR is no longer eligible for preview deployment.");
            }

            if (pr.head.sha !== expectedHeadSha) {
              throw new Error("PR head changed while deploying.");
            }

            if (
              pr.head.sha !== runHeadSha &&
              pr.merge_commit_sha !== runHeadSha
            ) {
              throw new Error("Build SHA no longer matches the PR.");
            }

            const { data: deployment } =
              await github.rest.repos.createDeployment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: pr.head.sha,
                task: "deploy",
                auto_merge: false,
                required_contexts: [],
                environment: "netlify-preview",
                description: `Netlify preview for PR #${prNumber}`,
                transient_environment: true,
                production_environment: false
              });

            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: deployment.id,
              state: "success",
              environment_url: deployUrl,
              log_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${runId}`,
              description: "Netlify preview deployed successfully."
            });

            const marker = "<!-- netlify-preview-deployment -->";

            const body = [
              marker,
              "### Netlify Preview",
              "",
              `**Preview:** [Open deployment](${deployUrl})`,
              "",
              `**Commit:** \`${pr.head.sha.slice(0, 7)}\``,
              "",
              `_Deployed by [GitHub Actions](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${runId})._`
            ].join("\n");

            try {
              const comments = await github.paginate(
                github.rest.issues.listComments,
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: prNumber
                }
              );

              const existing = comments.find(comment =>
                comment.body?.includes(marker) &&
                comment.user?.type === "Bot"
              );

              if (existing) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id,
                  body
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: prNumber,
                  body
                });
              }

              core.info(`Updated preview comment on PR #${prNumber}.`);
            } catch (error) {
              throw new Error(
                `Deployment succeeded, but PR comment failed: ${error.message}`
              );
            }
