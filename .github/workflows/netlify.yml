name: Deploy browser build to Netlify

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write
  statuses: write

concurrency:
  group: "netlify"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: netlify
      url: ${{ steps.netlify.outputs.deploy-url }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Build/package-lock.json

      - name: Install dependencies
        working-directory: Build
        run: npm ci

      - name: Setup WASM toolchain
        uses: ./.github/actions/setup-wasm

      - name: Build Symphonia WASM decoder
        uses: ./.github/actions/verify-wasm
        with:
          verify: "false"

      - name: Build
        working-directory: Build
        run: npm run build
        env:
           BASE_PATH: /

      - name: Deploy browser build to Netlify
        id: netlify
        uses: nwtgck/actions-netlify@v3
        with:
          publish-dir: './Build/dist'
          netlify-config-path: './netlify.toml'
          production-deploy: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: "Deploy from GitHub Actions"
          enable-commit-comment: false
          enable-github-deployment: false

        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
