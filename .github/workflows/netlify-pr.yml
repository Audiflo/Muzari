name: Build PR for Netlify

on:
  pull_request:
    branches: ["main"]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: netlify-preview-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build Komorebi
        working-directory: packages/komorebi
        run: npm ci && npm run build

      - name: Install dependencies
        working-directory: Build
        run: npm ci

      - name: Setup WASM
        uses: ./.github/actions/setup-wasm

      - name: Verify WASM
        uses: ./.github/actions/verify-wasm
        with:
          verify: "false"

      - name: Build
        working-directory: Build
        run: npm run build
        env:
          BASE_PATH: /

      - name: Upload Netlify artifact
        uses: actions/upload-artifact@v4
        with:
          name: netlify-preview
          path: Build/dist
          retention-days: 1
          include-hidden-files: true
